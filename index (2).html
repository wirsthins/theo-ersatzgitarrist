<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #111111;
    --black: #111111;
    --paper: #ffffff;
  }

  * { box-sizing: border-box; }

  .logo {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 56px;
    height: 56px;
    z-index: 10;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--black);
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-style: italic;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 32px 18px 60px;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  .rule {
    white-space: nowrap;
    overflow: hidden;
    letter-spacing: 0;
    font-weight: 700;
    line-height: 1.4;
    user-select: none;
  }

  .rule::before {
    content: "--------------------------------------------------------------------------------------------------";
  }

  .rule-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0;
    font-weight: 700;
  }

  .rule-label .dash {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
  }

  .rule-label .dash::before {
    content: "--------------------------------------------------------------------------------------------------";
  }

  .rule-label span.text {
    flex-shrink: 0;
  }

  .rule-label.red span.text {
    color: var(--red);
  }

  .rule-label.right {
    justify-content: flex-end;
  }

  header {
    margin-bottom: 4px;
  }

  header .rule-label .text {
    padding: 0 2px;
  }

  .hero {
    text-align: center;
    margin: 56px 0 40px;
  }

  .hero h1 {
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 700;
    margin: 0 0 6px;
  }

  .hero .year {
    font-size: clamp(28px, 7vw, 40px);
    font-weight: 700;
    margin: 0 0 28px;
  }

  .hero .tag {
    font-size: clamp(20px, 5.5vw, 28px);
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0 0 30px;
  }

  .status-line {
    font-size: clamp(17px, 4.6vw, 21px);
    margin: 0 0 6px;
  }

  .status-line .red {
    color: var(--red);
    font-weight: 700;
  }

  .stars {
    text-align: center;
    margin: 34px 0;
    font-size: 20px;
    letter-spacing: 10px;
  }

  section.block {
    text-align: center;
    margin: 40px 0;
  }

  section.block h2 {
    font-size: clamp(18px, 4.8vw, 22px);
    font-weight: 700;
    margin: 0 0 10px;
    text-transform: none;
  }

  section.block p, section.block a {
    font-size: clamp(16px, 4.4vw, 19px);
    margin: 0;
    color: var(--red);
    text-decoration: none;
    font-weight: 700;
  }

  section.block p.black {
    color: var(--black);
    font-weight: 400;
  }

  .whatsapp {
    display: inline-block;
    margin-top: 6px;
    padding: 12px 26px;
    border: 2px dashed var(--red);
    color: var(--red) !important;
    font-weight: 700;
    font-size: clamp(17px, 4.8vw, 20px);
    transition: background 0.15s ease, color 0.15s ease;
  }

  .whatsapp:hover, .whatsapp:focus-visible {
    background: var(--red);
    color: var(--paper) !important;
    outline: none;
  }

  footer {
    margin-top: 50px;
    text-align: center;
    font-size: 15px;
  }

  footer .contact {
    margin: 18px 0;
  }

  footer .contact a {
    color: var(--black);
    text-decoration: none;
  }

  footer .contact a:hover {
    color: var(--red);
  }

  footer .copyright {
    margin-top: 26px;
    font-size: 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .whatsapp { transition: none; }
  }
</style>
